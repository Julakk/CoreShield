# CoreShield - Deployment Workflow
# ----------------------------------
# Triggers automatically on every push to the `main` branch.
# Extend the "Deploy" step with your actual deployment commands
# (e.g. rsync, SSH, Docker build/push) once your infrastructure is defined.

name: CoreShield Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate config files
        run: |
          echo "Checking for required files..."
          test -f config/nginx.conf && echo "nginx.conf found"
          test -f scripts/block_ip.sh && echo "block_ip.sh found"

      - name: Lint shell scripts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          shellcheck scripts/block_ip.sh

      # ---- Placeholder deployment step ----
      # Replace with your real deployment logic, e.g.:
      #
      # - name: Deploy over SSH
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.SSH_HOST }}
      #     username: ${{ secrets.SSH_USER }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     script: |
      #       cd /path/to/deployment
      #       git pull origin main
      #       sudo systemctl reload nginx
      - name: Deploy (placeholder)
        run: echo "Add your deployment steps here (SSH, Docker, etc.)"
