# CoreShield - Reverse Proxy Configuration Template
# ---------------------------------------------------
# Replace placeholders below before deploying:
#   <YOUR_DOMAIN>        - your public domain name
#   <BACKEND_HOST>       - internal backend hostname or IP
#   <BACKEND_PORT>       - internal backend port

server {
    listen 80;
    listen [::]:80;
    server_name <YOUR_DOMAIN>;

    # Redirect all HTTP traffic to HTTPS (enable once SSL is configured)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://<BACKEND_HOST>:<BACKEND_PORT>;

        # Preserve original client info for the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts - adjust to your workload
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Basic request size limit (mitigate abuse)
        client_max_body_size 10m;
    }

    # Deny access to hidden files (e.g. .env, .git)
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/coreshield_access.log;
    error_log  /var/log/nginx/coreshield_error.log;
}

